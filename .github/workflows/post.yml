name: Facebook Auto Post

on:
  schedule:
    - cron: '0 */3 * * *'  # ทุก 3 ชั่วโมง (~8 โพสต์/วัน)
  workflow_dispatch:       # รันมือได้จาก GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check token permissions
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          python - <<'EOF'
          import os, requests
          token = os.environ["PAGE_ACCESS_TOKEN"]
          app_id = os.environ["APP_ID"]
          app_secret = os.environ["APP_SECRET"]
          res = requests.get(
              "https://graph.facebook.com/debug_token",
              params={"input_token": token, "access_token": f"{app_id}|{app_secret}"}
          )
          data = res.json().get("data", {})
          scopes = data.get("scopes", [])
          print("Token scopes:", scopes)
          print("Is valid:", data.get("is_valid"))
          EOF

      - name: Run poster
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_poster.py

      - name: Save dedup history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "chore: update dedup history"
          git push
